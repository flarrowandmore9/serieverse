<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="fondoCrema" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fdfbfb"/>
      <stop offset="100%" stop-color="#efe8e8"/>
    </radialGradient>
    <linearGradient id="moradoIcono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5a9e"/>
      <stop offset="100%" stop-color="#764988"/>
    </linearGradient>
  </defs>

  <!-- Fondo cuadrado con esquinas redondeadas -->
  <rect width="512" height="512" rx="115" fill="url(#fondoCrema)"/>

  <!-- Sombra inferior suave -->
  <ellipse cx="265" cy="405" rx="85" ry="10" fill="#764988" opacity="0.2"/>

  <!-- Estrellas superiores izquierda -->
  <path d="M168 92 C168 112 174 118 194 118 C174 118 168 124 168 144 C168 124 162 118 142 118 C162 118 168 112 168 92 Z" fill="#815293"/>
  <path d="M134 126 C134 137 137 140 148 140 C137 140 134 143 134 154 C134 143 131 140 120 140 C131 140 134 137 134 126 Z" fill="#815293"/>

  <!-- Parte trasera de la órbita -->
  <path d="M138 258 C95 292 85 328 115 348" fill="none" stroke="url(#moradoIcono)" stroke-width="16" stroke-linecap="round"/>
  <path d="M368 175 C405 172 425 186 418 208" fill="none" stroke="url(#moradoIcono)" stroke-width="12" stroke-linecap="round"/>

  <!-- Cuerpo principal de la claqueta -->
  <path d="M155 215 H365 V325 C365 352 345 370 318 370 H202 C175 370 155 352 155 325 Z" fill="none" stroke="url(#moradoIcono)" stroke-width="18" stroke-linejoin="round"/>

  <!-- Botón Play central -->
  <path d="M236 254 L292 288 L236 322 Z" fill="url(#moradoIcono)" stroke="url(#moradoIcono)" stroke-width="10" stroke-linejoin="round"/>

  <!-- Parte superior de la claqueta (inclinada) -->
  <g transform="rotate(-11 155 205)">
    <path d="M142 165 C142 152 152 142 165 142 H375 C386 142 394 150 394 161 V188 H142 Z" fill="url(#moradoIcono)"/>
    <!-- Franjas blancas inclinadas -->
    <polygon points="195,147 232,147 215,183 178,183" fill="#f9f6f6"/>
    <polygon points="260,147 297,147 280,183 243,183" fill="#f9f6f6"/>
    <polygon points="325,147 362,147 345,183 308,183" fill="#f9f6f6"/>
    <!-- Círculo blanco de bisagra -->
    <circle cx="163" cy="168" r="10" fill="#f9f6f6"/>
  </g>

  <!-- Parte delantera de la órbita -->
  <path d="M115 348 C155 372 285 335 375 268 C408 242 422 220 418 208" fill="none" stroke="url(#moradoIcono)" stroke-width="22" stroke-linecap="round"/>
</svg>
